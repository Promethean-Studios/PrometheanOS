version: '3.8'

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: promethean-vllm
    restart: unless-stopped
    command: >-
      --model mistralai/Mistral-7B-Instruct-v0.2
      --host 0.0.0.0
      --port 8000
      --gpu-memory-utilization 0.9
    environment:
      - HF_HUB_ENABLE_HF_TRANSFER=1
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
    runtime: nvidia
    profiles:
      - ai

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: promethean-open-webui
    restart: unless-stopped
    environment:
      - OLLAMA_BASE_URL=http://host.containers.internal:11434
      - WEBUI_AUTH=False
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
    profiles:
      - ai

  comfyui:
    image: ghcr.io/comfyanonymous/comfyui:latest
    container_name: promethean-comfyui
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - GPU_DEVICE_ORDINAL=0
    ports:
      - "127.0.0.1:8188:8188"
    volumes:
      - comfyui-models:/workspace/models
      - comfyui-output:/workspace/output
    devices:
      - /dev/dri:/dev/dri
    runtime: nvidia
    profiles:
      - ai

volumes:
  open-webui-data:
  comfyui-models:
  comfyui-output:
